name: CI Dev Frontend

on:
  push:
    branches:
      - "dev"

permissions:
  contents: read
  packages: write

jobs:
  build:
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ secrets.CONTAINER_NAME }}:latest

  deployment:
    needs: build
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          password: ${{ secrets.DEV_PASSWORD }}
          port: ${{ secrets.DEV_PORT }}
          script: |
            echo "Navigating to project directory..."
            cd ${{ secrets.APP_PATH }}
            
            echo "Stopping and removing previous container..."
            docker stop ${{ secrets.CONTAINER_NAME }} || true && docker rm ${{ secrets.CONTAINER_NAME }} || true
            
            echo "Pulling the latest image from GHCR..."
            docker pull ghcr.io/${{ github.repository_owner }}/${{ secrets.CONTAINER_NAME }}:latest
            
            echo "Running the container..."
            docker run -d \
              -p 3034:3000 \
              --name ${{ secrets.CONTAINER_NAME }} \
              --env-file .env \
              ghcr.io/${{ github.repository_owner }}/${{ secrets.CONTAINER_NAME }}:latest
