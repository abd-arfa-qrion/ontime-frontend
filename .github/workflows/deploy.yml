name: Deploy to VPS

on:
  push:
    branches:
      - "prod"

jobs:
  deploy:
    environment: prod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ vars.CONTAINER_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/${{ vars.CONTAINER_NAME }}:latest
          build-args: |
            NEXT_PUBLIC_BACKEND_API_BASEURL=${{ secrets.NEXT_PUBLIC_BACKEND_API_BASEURL }}
            BACKEND_API_BASEURL=${{ secrets.BACKEND_API_BASEURL }}
            NEXT_PUBLIC_GRECAPTCHA_SITE_KEY=${{ secrets.NEXT_PUBLIC_GRECAPTCHA_SITE_KEY }}
            GRECAPTCHA_SECRET_KEY=${{ secrets.GRECAPTCHA_SECRET_KEY }}
            FRONTEND_URL=${{ vars.FRONTEND_URL }}
            NEXTAUTH_URL=${{ vars.NEXTAUTH_URL }}
            SUPEBASE_PUBLIC_KEY=${{ secrets.SUPEBASE_PUBLIC_KEY }}
            NEXT_PUBLIC_NEXTAUTH_URL=${{ vars.NEXT_PUBLIC_NEXTAUTH_URL }}
            NEXT_PUBLIC_URL_PARAM_ENCRYPT_KEY=${{ secrets.NEXT_PUBLIC_URL_PARAM_ENCRYPT_KEY }}
            NEXT_PUBLIC_URL_ENCRYPT_KEY=${{ secrets.NEXT_PUBLIC_URL_ENCRYPT_KEY }}
            NEXT_PUBLIC_SUPEBASE_SECRET_KEY=${{ secrets.NEXT_PUBLIC_SUPEBASE_SECRET_KEY }}
            NEXT_PUBLIC_QMS_BASEURL=${{ secrets.NEXT_PUBLIC_QMS_BASEURL }}
            NEXT_PUBLIC_ONTUITION_BASEURL=${{ secrets.NEXT_PUBLIC_ONTUITION_BASEURL }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "Stopping old container..."
            docker stop ${{ vars.CONTAINER_NAME }} || true

            echo "Removing old container..."
            docker rm ${{ vars.CONTAINER_NAME }} || true

            echo "Cleaning old unused Docker images..."
            docker image prune -af || true

            echo "Pulling latest image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ vars.CONTAINER_NAME }}:${{ github.sha }}

            echo "Running new container..."
            docker run -d \
              --restart always \
              -p 3000:3000 \
              --name ${{ vars.CONTAINER_NAME }} \
              -e NODE_ENV=production \
              -e NEXTAUTH_SECRET='${{ secrets.NEXTAUTH_SECRET }}' \
              -e BACKEND_API_BASEURL='${{ secrets.BACKEND_API_BASEURL }}' \
              -e NEXT_PUBLIC_BACKEND_API_BASEURL='${{ secrets.NEXT_PUBLIC_BACKEND_API_BASEURL }}' \
              -e NEXT_PUBLIC_GRECAPTCHA_SITE_KEY='${{ secrets.NEXT_PUBLIC_GRECAPTCHA_SITE_KEY }}' \
              -e GRECAPTCHA_SECRET_KEY='${{ secrets.GRECAPTCHA_SECRET_KEY }}' \
              -e FRONTEND_URL='${{ vars.FRONTEND_URL }}' \
              -e NEXTAUTH_URL='${{ vars.NEXTAUTH_URL }}' \
              -e SUPEBASE_PUBLIC_KEY='${{ secrets.SUPEBASE_PUBLIC_KEY }}' \
              -e NEXT_PUBLIC_URL_PARAM_ENCRYPT_KEY='${{ secrets.NEXT_PUBLIC_URL_PARAM_ENCRYPT_KEY }}' \
              -e NEXT_PUBLIC_URL_ENCRYPT_KEY='${{ secrets.NEXT_PUBLIC_URL_ENCRYPT_KEY }}' \
              -e NEXT_PUBLIC_SUPEBASE_SECRET_KEY='${{ secrets.NEXT_PUBLIC_SUPEBASE_SECRET_KEY }}' \
              -e NEXT_PUBLIC_QMS_BASEURL='${{ secrets.NEXT_PUBLIC_QMS_BASEURL }}' \
              -e NEXT_PUBLIC_ONTUITION_BASEURL='${{ secrets.NEXT_PUBLIC_ONTUITION_BASEURL }}' \
              -e NEXT_PUBLIC_NEXTAUTH_URL='${{ vars.NEXT_PUBLIC_NEXTAUTH_URL }}' \
              ${{ secrets.DOCKER_USERNAME }}/${{ vars.CONTAINER_NAME }}:${{ github.sha }}

            echo "Deployment success!"
